<script> 
    // HOF - High Order Function (funções que recebem outras funções como parametro)
    
    // Arrow function
    let fSomar = (n1, n2) => {
        console.log(n1+n2)
    }
    
    //função anonima
    let fDividir = function (n1, n2){
        console.log(n1/n2)
    }

    function executar(func, n1, n2){
        func(n1, n2)
    }
</script>
