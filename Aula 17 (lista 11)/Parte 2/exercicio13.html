<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 13</title>
</head>
<body>
    <button onclick="sortear()">Sortear Temperatura</button>
    <div id="div_msg"></div>
</body>
</html>
<script>
    function sortear(){
        let temp = (Math.random()*(20-(-20))+(-20)).toFixed(0)

        div_msg.innerHTML = `Temperatura sorteada: ${temp}`

        if (temp < 1) {
            div_msg.innerHTML += `<br>Dá pra conservar qualquer alimento`
        } else if (temp < 10) {
            div_msg.innerHTML += `<br>Conserva a maioria dos alimentos`
        } else if (temp > 10) {
            div_msg.innerHTML += `<br>Estraga a maioria dos alimentos`
        }
    }
</script>
