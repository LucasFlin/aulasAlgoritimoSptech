<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 10</title>
</head>
<body>
    <h1>Jogo de dados</h1>
    <button onclick="dado1()">Dado Jogador 1</button>
    <div id="div_j1"></div>
    <button onclick="dado2()">Dado Jogador 2</button>
    <div id="div_j2"></div>
    <button onclick="comparar()">Comparar Resultados</button>
    <div id="div_resultado"></div>
</body>
</html>
<script>
    let j1 = 0
    let j2 = 0
    function dado1(){
        j1 = (Math.random()*5).toFixed(0)
        if(j1 == 0){
            div_j1.innerHTML = '<img src="./d6-1.png">'
        }else if(j1 == 1){
            div_j1.innerHTML = '<img src="./d6-2.png">'
        }else if(j1 == 2){
            div_j1.innerHTML = '<img src="./d6-3.png">'
        }else if(j1 == 3){
            div_j1.innerHTML = '<img src="./d6-4.png">'
        }else if(j1 == 4){
            div_j1.innerHTML = '<img src="./d6-5.png">'
        }else if(j1 == 5){
            div_j1.innerHTML = '<img src="./d6-6.png">'
        }
    }

    function dado2(){
        j2 = (Math.random()*5).toFixed(0)
        if(j2 == 0){
            div_j2.innerHTML = '<img src="./d6-1.png">'
        }else if(j2 == 1){
            div_j2.innerHTML = '<img src="./d6-2.png">'
        }else if(j2 == 2){
            div_j2.innerHTML = '<img src="./d6-3.png">'
        }else if(j2 == 3){
            div_j2.innerHTML = '<img src="./d6-4.png">'
        }else if(j2 == 4){
            div_j2.innerHTML = '<img src="./d6-5.png">'
        }else if(j2 == 5){
            div_j2.innerHTML = '<img src="./d6-6.png">'
        }
    }
    function comparar(){
        if(j1 > j2){
            div_resultado.innerHTML = 'Jogador 1 venceu!'
        } else if (j1 < j2){
            div_resultado.innerHTML = 'Jogador 2 venceu!'
        }else if (j1 == j2){
            div_resultado.innerHTML = 'Empate!'
        }
    }
</script>
