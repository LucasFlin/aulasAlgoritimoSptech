<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 17</title>
</head>
<body>
    <p>Nome <input type="text" id="ipt_nome"></p>
    <p>Numeros da sorte: <input type="text" id="ipt_num1"> <input type="text" id="ipt_num2"> <input type="text" id="ipt_num3"></p>
    <button onclick="sortear()">Sortear</button>
    <div id="div_msg"></div>
</body>
</html>
<script>
    let contador = 0

    function sortear(){
        let sorte1 = ipt_num1.value
        let sorte2 = ipt_num2.value
        let sorte3 = ipt_num3.value

        if (sorte1 > 100 || sorte1 < 1){
            alert("Digite números entre 1 e 100")
            ipt_num1.innerHTML = ''
            ipt_num2.innerHTML = ''
            ipt_num3.innerHTML = ''
        }else if (sorte2 > 100 || sorte2 < 1){
            alert("Digite números entre 1 e 100")
            ipt_num1.innerHTML = ''
            ipt_num2.innerHTML = ''
            ipt_num3.innerHTML = ''
        } else if (sorte3 > 100 || sorte3 < 1) {
            alert("Digite números entre 1 e 100")
            ipt_num1.innerHTML = ''
            ipt_num2.innerHTML = ''
            ipt_num3.innerHTML = ''
        } else {
            contador++
        }

        let sorteado = (Math.random()*(100-1)+1).toFixed(0)

        if (sorteado == sorte1){
            div_msg.innerHTML = `Parabéns, ${ipt_nome.value} seu numero da sorte ${sorte1} for sorteado após ${contador} sorteios!`
        } else if (sorteado == sorte2){
            div_msg.innerHTML = `Parabéns, ${ipt_nome.value} seu numero da sorte ${sorte2} for sorteado após ${contador} sorteios!`
        } else if (sorteado == sorte3){
            div_msg.innerHTML = `Parabéns, ${ipt_nome.value} seu numero da sorte ${sorte3} for sorteado após ${contador} sorteios!`
        }
    }
</script>
