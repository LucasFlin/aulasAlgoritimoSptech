<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 8</title>
</head>

<body>
    <h1>Analise de aluno</h1>
    <button onclick="nota()">Gerar uma nota de aluno entre 0 e 10</button>
    <div id="div_nota"></div>
    <button onclick="frequencia()">Gerar uma frequência de aluno entre 0 e 100</button>
    <div id="div_freq"></div>
    <button onclick="situacao()">Ver Situação</button>
</body>

</html>
<script>
    let numNota = 0
    let freq = 0
    function nota() {
        numNota = (Math.random() * 10).toFixed(2)
        div_nota.innerHTML = `Nota: ${numNota}`
    }
    function frequencia() {
        freq = (Math.random() * 100).toFixed(2)
        div_freq.innerHTML = `Frequencia: ${freq}`
    }
    function situacao() {
        alert(`É um aluno nota ${numNota}, e está presente em ${freq}% das aulas`)
    }
</script>
