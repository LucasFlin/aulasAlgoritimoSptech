<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 9</title>
</head>

<body>
    <h1>Analise de aluno 2</h1>
    <button onclick="nota()">Gerar uma nota de aluno entre 3 e 10</button>
    <div id="div_nota"></div>
    <button onclick="frequencia()">Gerar uma frequência de aluno entre 50 e 100</button>
    <div id="div_freq"></div>
    <button onclick="situacao()">Ver Aprovação</button>
</body>

</html>
<script>
    let numNota = 0
    let freq = 0
    function nota() {
        numNota = (Math.random() * (10 - 3) + 3).toFixed(1)
        div_nota.innerHTML = `Nota: ${numNota}`
    }
    function frequencia() {
        freq = (Math.random() * (100 - 50) + 50).toFixed(1)
        div_freq.innerHTML = `Frequencia: ${freq}`
    }
    function situacao() {
        let passa = 'Reprovado'
        if (numNota >= 6 && freq >= 75) {
            passa = 'Aprovado'
        }
        alert(`Com nota ${numNota}, e frequência ${freq}%, o aluno está ${passa}`)
    }
</script>
