<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 1</title>
</head>

<body>
    <input type="text" id="ipt_cliente">
    <button onclick="entrar(ipt_cliente.value)">Entrar na fila</button> <button
        onclick="proximo(ipt_cliente.value)">Chamar o próximo</button>
    <div id="aviso"></div>
    <div id="fila_atual">Fila:</div>
    <div id="historico">Historico</div>
</body>

</html>
<script>
    let fila = []
    function entrar(nome) {
        if (nome == '') {
            alert('Escreva um nome')
            return
        } else {
            fila.push(nome)
            aviso.innerHTML = `<p>${nome} entrou na fila. Posição: ${fila.lastIndexOf(nome)}</p>`
            fila_atual.innerHTML = 'Fila:'

            fila.forEach(pessoa => {
                fila_atual.innerHTML += `<br>- ${pessoa}`
            });
        }
    }

    function proximo(nome) {
        if (fila[0] == undefined) {
            alert('A fila está vazia')
            return
        } else {
            historico.innerHTML += `<br>- ${fila[0]}`
            fila.shift()
            aviso.innerHTML = `<p>Chamando: ${nome}. Restam ${fila.length}</p>`
            fila_atual.innerHTML = 'Fila: '
            console.log(fila)
            fila.forEach(pessoa => {
                fila_atual.innerHTML += `<br>- ${pessoa}`
            });
        }
    }
</script>
