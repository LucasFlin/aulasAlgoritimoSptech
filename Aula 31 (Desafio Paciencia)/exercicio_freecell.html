    body {
      background-color: #0b5d1e;
      color: white;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .topo {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 30px;
      gap: 20px;
    }

    .controle-movimento {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 25px;
    }

    .inputs-movimento {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .inputs-movimento input {
      padding: 10px;
      border-radius: 6px;
      border: none;
      width: 130px;
      font-size: 14px;
    }

    .botao-movimentar {
      padding: 10px 18px;
      cursor: pointer;
      border-radius: 6px;
      border: 2px solid white;
      background-color: white;
      color: #0b5d1e;
      font-weight: bold;
      transition: 0.2s;
    }

    .botao-movimentar:hover {
      background-color: #0b5d1e;
      color: white;
      transform: scale(1.08);
    }

    .area {
      display: flex;
      gap: 10px;
    }

    .pilha {
      width: 90px;
      min-height: 120px;
      border: 2px dashed rgba(255, 255, 255, 0.5);
      border-radius: 8px;
      padding: 5px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      background-color: rgba(255, 255, 255, 0.05);
    }

    .tabuleiro {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 10px;
    }

    .coluna {
      min-height: 500px;
      border-radius: 8px;
      padding: 5px;
      background-color: rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .carta {
      background-color: white;
      color: black;
      border-radius: 6px;
      padding: 10px;
      cursor: pointer;
      text-align: center;
      font-weight: bold;
      border: 2px solid transparent;
    }

    .vermelho {
      color: red;
    }

    .selecionada {
      border-color: yellow;
    }

    .info {
      margin-top: 20px;
      font-size: 18px;
    }
  </style>

    function embaralharCartas() {
      let placeholder = []

      for (let i = 0; i < cartas.length; i++) {

        colunaDiv.onclick = () => clicarColuna(i);

        for (let j = 0; j < colunas[i].length; j++) {

          const carta = colunas[i][j];

          const cartaDiv = document.createElement('div');
          cartaDiv.className = `carta ${carta.cor === 'vermelho' ? 'vermelho' : ''}`;

          cartaDiv.innerText = `${carta.valor} ${carta.simbolo}`;

          colunaDiv.appendChild(cartaDiv);
        }

        tabuleiro.appendChild(colunaDiv);
      }

      renderizarAuxiliares();
      renderizarFinais();
    }


    function renderizarAuxiliares() {

      const container = document.getElementById('auxiliares');
      container.innerHTML = '';

      for (let i = 0; i < auxiliares.length; i++) {

        const pilha = document.createElement('div');
        pilha.className = 'pilha';

        const titulo = document.createElement('h4');
        titulo.innerText = `Pilha ${obterNumeroPilha('auxiliar', i)}`;
        titulo.style.marginBottom = '10px';

        pilha.appendChild(titulo);

        if (auxiliares[i][0]) {

          const carta = auxiliares[i][0];

          const cartaDiv = document.createElement('div');
          cartaDiv.className = `carta ${carta.cor === 'vermelho' ? 'vermelho' : ''}`;

          cartaDiv.innerText = `${carta.valor} ${carta.simbolo}`;

          pilha.appendChild(cartaDiv);
        }

        container.appendChild(pilha);
      }
    }


    function renderizarFinais() {

      const container = document.getElementById('finais');
      container.innerHTML = '';

      for (let i = 0; i < finais.length; i++) {

        const pilha = document.createElement('div');
        pilha.className = 'pilha';

        const titulo = document.createElement('h4');
        titulo.innerText = `Pilha ${obterNumeroPilha('final', i)}`;
        titulo.style.marginBottom = '10px';

        pilha.appendChild(titulo);

        if (finais[i].length > 0) {

          const carta = finais[i][finais[i].length - 1];

          const cartaDiv = document.createElement('div');
          cartaDiv.className = `carta ${carta.cor === 'vermelho' ? 'vermelho' : ''}`;

          cartaDiv.innerText = `${carta.valor} ${carta.simbolo}`;

          pilha.appendChild(cartaDiv);
        }

        container.appendChild(pilha);
      }
    }

    function finalizarMovimento() {

      cartaSelecionada = null;

      renderizar();

      verificarVitoria();
    }


    function mostrarMensagem(texto) {
      document.getElementById('mensagem').innerText = texto;
    }


    // =====================================================
    // INICIALIZAÇÃO
    // =====================================================

    embaralharCartas();
    distribuirCartas();
    renderizar();

  </script>
</body>

</html>
