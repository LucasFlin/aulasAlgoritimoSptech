<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 10</title>
</head>

<body>
    <input type="text" id="compra"><select id="categoria">
        <option value="">Selecione a categoria</option>
        <option value="estudante">Estudante</option>
        <option value="idoso">Idoso</option>
        <option value="professor">Professor</option>
        <option value="comum">Comum</option>
    </select>
    <button onclick="calcular(Number(compra.value), categoria.value)">Calcular</button>
    <p id="preco"></p>
</body>

</html>
<script>
    const descontos = {
        "estudante": 0.20,
        "idoso": 0.15,
        "professor": 0.10,
        "comum": 0.00
    };

    function calcular(n, tipo){
        preco.innerHTML = n-(n*descontos[tipo])
    }
</script>
